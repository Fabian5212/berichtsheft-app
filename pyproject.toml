[project]
name = "berichtsheft-assistent"
version = "1.1.0"
description = "Berichtsheft (Word) automatisch aus GFN-Klassenbuch-PDFs erstellen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-docx==1.2.0",
    "pymupdf==1.28.0",
    "customtkinter==6.0.0",
    "tkinterdnd2==0.7.0",
]

[project.scripts]
berichtsheft-cli = "berichtsheft.cli:main"

[project.gui-scripts]
berichtsheft = "berichtsheft.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
